name: oppa_mobile
description: OPPA — Africa-first messaging, wallet, business and calls.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP + connectivity: deliberately small dependency set for low-end Android.
  http: ^1.2.0
  connectivity_plus: ^6.0.0
  provider: ^6.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  pointycastle: ^3.9.1
  # Voice-to-text + text-to-speech (on-device engines, honest degradation
  # when a device has no speech service installed).
  # ^7.0.0 minimum: 6.x compiles the legacy v1 Android embedding (Registrar),
  # whose engine classes were removed in Flutter 3.29+ — the CI APK build
  # failed on 6.6.0 with "Unresolved reference 'Registrar'".
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Test-only: startup tests install a fake secure-storage platform.
  flutter_secure_storage_platform_interface: ^1.1.2

flutter:
  uses-material-design: true
