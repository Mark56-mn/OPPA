name: oppa_mobile
description: OPPA — Africa-first messaging, wallet, business and calls.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP + connectivity: deliberately small dependency set for low-end Android.
  http: ^1.2.0
  connectivity_plus: ^6.0.0
  provider: ^6.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
