# Right-sized for CI build VMs (~8 GB RAM): the flutter-create default of
# -Xmx8G/-XX:MaxMetaspaceSize=4G starved the daemon and CI failed with
# "Java heap space" inside the JetifyTransform. 4G/1G is ample for a debug
# APK build of this app.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier is only needed for pre-AndroidX support-library dependencies.
# Every plugin in this app is AndroidX-native (flutter_secure_storage,
# speech_to_text 7.x, flutter_tts, connectivity_plus, path_provider,
# shared_preferences), and leaving it on broke CI OOM-ing while jetifying
# the Flutter engine jar. Keep it off unless a legacy dependency is added.
android.enableJetifier=false
