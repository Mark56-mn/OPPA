name: OPPA API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "package.json"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "package.json"
      - ".github/workflows/api.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: node --import tsx --test src/modules/otp/otp-crypto.test.ts
